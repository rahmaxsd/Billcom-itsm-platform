spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/itsm}
    username: ${DB_USER:itsm}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
    expiration-minutes: 120
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost}
  seed:
    password: ${SEED_PASSWORD:Admin123!}
